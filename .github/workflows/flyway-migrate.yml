# ---------------------------------------------------------------------------
# Plantilla — Migración de esquema con Flyway vía GitHub Actions
#
# Módulo: Tendencias emergentes en desarrollo de software (SI6010-5979)
# Sesión de referencia: Cap_1_Fundamentos_DataOps/sesion_02_cicd_flyway
#
# Comportamiento:
#   - Pull request  → `flyway validate` + `flyway migrate` contra el entorno DEV
#   - Push a main   → `flyway migrate` contra el entorno PROD
#   - Manual        → workflow_dispatch permite elegir el entorno
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   FLYWAY_URL_DEV       jdbc:postgresql://<host>/<db>?sslmode=require
#   FLYWAY_USER_DEV
#   FLYWAY_PASSWORD_DEV
#   FLYWAY_URL_PROD
#   FLYWAY_USER_PROD
#   FLYWAY_PASSWORD_PROD
#
# ⚠️ Esta es una PLANTILLA. Ajusta `MIGRATIONS_DIR` y los nombres de los secretos
#    a la estructura real de tu repositorio antes de habilitarla.
# ---------------------------------------------------------------------------

name: Flyway Migrate

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/flyway-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/flyway-migrate.yml'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno destino de la migración'
        required: true
        type: choice
        default: dev
        options: [dev, prod]

# Evita que dos migraciones corran simultáneamente contra la misma base de datos.
concurrency:
  group: flyway-${{ github.ref }}
  cancel-in-progress: false

env:
  FLYWAY_VERSION: '13.1.0'
  MIGRATIONS_DIR: migrations

jobs:
  migrate:
    name: Aplicar migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      # ---------------------------------------------------------------------
      # Resuelve el entorno destino según el evento que disparó el workflow.
      # ---------------------------------------------------------------------
      - name: Determinar entorno destino
        id: entorno
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            destino="${{ inputs.entorno }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            destino="prod"
          else
            destino="dev"
          fi
          echo "destino=${destino}" >> "$GITHUB_OUTPUT"
          echo "Entorno destino: ${destino}"

      - name: Instalar Flyway CLI
        run: |
          curl -fsSL \
            "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            -o flyway.tar.gz
          tar -xzf flyway.tar.gz
          echo "${GITHUB_WORKSPACE}/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"

      - name: Verificar instalación
        run: flyway --version

      # ---------------------------------------------------------------------
      # `validate` es la puerta de calidad: detecta migraciones ya aplicadas
      # cuyo checksum cambió, y migraciones faltantes. Falla el job antes de
      # tocar la base de datos.
      # ---------------------------------------------------------------------
      - name: Flyway validate
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: |
          flyway validate \
            -locations="filesystem:${MIGRATIONS_DIR}" \
            -validateMigrationNaming=true \
            -ignoreMigrationPatterns='*:pending'

      - name: Flyway info (estado previo)
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: flyway info -locations="filesystem:${MIGRATIONS_DIR}"

      - name: Flyway migrate
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: |
          flyway migrate \
            -locations="filesystem:${MIGRATIONS_DIR}" \
            -outOfOrder=false \
            -cleanDisabled=true

      # `if: always()` — queremos el estado final incluso si migrate falló.
      - name: Flyway info (estado final)
        if: always()
        env:
          FLYWAY_URL: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV }}
          FLYWAY_USER: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_USER_PROD || secrets.FLYWAY_USER_DEV }}
          FLYWAY_PASSWORD: ${{ steps.entorno.outputs.destino == 'prod' && secrets.FLYWAY_PASSWORD_PROD || secrets.FLYWAY_PASSWORD_DEV }}
        run: flyway info -locations="filesystem:${MIGRATIONS_DIR}"

      - name: Resumen del run
        if: always()
        run: |
          {
            echo "## Flyway — resultado"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Entorno | \`${{ steps.entorno.outputs.destino }}\` |"
            echo "| Evento | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Estado | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
